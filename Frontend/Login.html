<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingreso Profesores</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://unpkg.com/vue@3"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div id="app" class="container py-5">
    <h2 class="text-center mb-4">Iniciar sesión con Google</h2>

    <div id="g_id_onload"
         data-client_id="724288589387-ec6bdrnoekhrq94r2rp9oet7e04th24b.apps.googleusercontent.com"
         data-context="signin"
         data-callback="handleCredentialResponse"
         data-auto_prompt="false">
    </div>

    <div class="g_id_signin"
         data-type="standard"
         data-size="large"
         data-theme="outline"
         data-text="sign_in_with"
         data-shape="rectangular"
         data-logo_alignment="left">
    </div>

    <p class="alert alert-success mt-4" v-if="message">{{ message }}</p>
    <p class="alert alert-danger mt-4" v-if="error">{{ error }}</p>
  </div>

<!-- Solo reemplazar el script actual -->
<script>
  const App = {
    setup() {
      const message = Vue.ref('');
      const error = Vue.ref('');

      window.handleCredentialResponse = async (response) => {
        const id_token = response.credential;

        try {
          const oauthResp = await fetch('http://localhost:8080/login/oauth', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ idToken: id_token, provider: 'google' })
          });

          if (!oauthResp.ok) throw new Error('OAuth inválido');

          const { email } = await oauthResp.json();

          const validarResp = await fetch('http://localhost:8080/api/v1/validarProfesor', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ email })
          });

          if (validarResp.status === 403) {
            throw new Error('Acceso denegado: solo profesores pueden ingresar');
          }

          sessionStorage.setItem("usuarioValido", "true");
          sessionStorage.setItem("correoProfesor", email);

          message.value = `¡Bienvenido profesor: ${email}!`;
          error.value = '';
          window.location.href = "/SeleccionGrupos.html";

        } catch (err) {
          error.value = err.message;
          message.value = '';
        }
      };

      return { message, error };
    }
  };

  Vue.createApp(App).mount('#app');
</script>

</body>
</html>
