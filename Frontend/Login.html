<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ingreso Profesores</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://unpkg.com/vue@3"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .icono-modal {
      font-size: 3rem;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body class="bg-light d-flex justify-content-center align-items-center vh-100">

  <div id="app" class="card shadow p-4 position-relative" style="max-width: 450px; width: 100%;">
    <div class="text-center mb-4">
      <img src="logo.png" alt="Logo AsisteUCO" style="max-height: 300px;" class="mb-2">
      <h3 class="fw-bold">Bienvenido a AsisteUCO</h3>
      <p class="text-muted">Iniciar sesión con Google</p>
    </div>

    <div id="g_id_onload"
         data-client_id="724288589387-ec6bdrnoekhrq94r2rp9oet7e04th24b.apps.googleusercontent.com"
         data-context="signin"
         data-callback="handleCredentialResponse"
         data-auto_prompt="false">
    </div>

    <div class="g_id_signin d-flex justify-content-center"
         data-type="standard"
         data-size="large"
         data-theme="outline"
         data-text="sign_in_with"
         data-shape="rectangular"
         data-logo_alignment="left">
    </div>

    <!-- Modal dentro de #app -->
    <div class="modal fade show" id="modalMensaje" tabindex="-1" style="display: block;" v-if="mostrar">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div :class="modalEsError ? 'modal-header bg-danger text-white' : 'modal-header bg-success text-white'">
            <h5 class="modal-title w-100 text-center">{{ modalTitulo }}</h5>
          </div>
          <div class="modal-body text-center">
            <div class="icono-modal">
              <span v-if="modalEsError">❌</span>
              <span v-else>✅</span>
            </div>
            <div class="fs-5">{{ modalTexto }}</div>
          </div>
          <div class="modal-footer justify-content-center">
            <button type="button" class="btn btn-primary px-4" @click="cerrarModal">Aceptar</button>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Vue App -->
  <script>
    const App = {
      setup() {
        const modalEsError = Vue.ref(false);
        const modalTexto = Vue.ref('');
        const modalTitulo = Vue.computed(() => modalEsError.value ? 'Acceso Denegado' : 'Acceso Autorizado');
        const mostrar = Vue.ref(false);
        let continuar = false;

        const mostrarModal = (mensaje, esError = false, continuarLuego = false) => {
          modalTexto.value = mensaje;
          modalEsError.value = esError;
          continuar = continuarLuego;
          mostrar.value = true;
        };

        const cerrarModal = () => {
          mostrar.value = false;
          if (continuar) {
            window.location.href = "/SeleccionGrupos.html";
          }
        };

        window.handleCredentialResponse = async (response) => {
          const id_token = response.credential;

          try {
            const oauthResp = await fetch('http://localhost:8080/asisteuco/apigateway/login/oauth', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ idToken: id_token })
            });

            if (!oauthResp.ok) throw new Error('OAuth inválido');

            const { email } = await oauthResp.json();

            const validarResp = await fetch('http://localhost:8080/asisteuco/apigateway/validarProfesor', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ email })
            });

            if (validarResp.status === 200) {
              sessionStorage.setItem("usuarioValido", "true");
              sessionStorage.setItem("correoProfesor", email);
              mostrarModal("Usuario autorizado. ¡Bienvenido!", false, true);
            } else {
              mostrarModal("Usuario no autorizado. Debe ser un profesor de la UCO registrado en AsisteUCO", true);
            }

          } catch (err) {
            mostrarModal("Error de conexión. Intente nuevamente.", true);
            console.error(err);
          }
        };

        return {
          modalEsError,
          modalTexto,
          modalTitulo,
          mostrar,
          cerrarModal
        };
      }
    };

    Vue.createApp(App).mount('#app');
  </script>
</body>
</html>
