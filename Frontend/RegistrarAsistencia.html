<!DOCTYPE html> 
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registrar Asistencia</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
    }

    .table-container {
      border: 1px solid #dee2e6;
      border-radius: 0.75rem;
      padding: 1.5rem;
      background-color: white;
      box-shadow: 0 0.5rem 1rem rgba(0,0,0,0.05);
    }

    .modal {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background-color: rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1050;
    }

    .modal-contenido {
      background: white;
      padding: 2rem;
      border-radius: 1rem;
      max-width: 500px;
      width: 90%;
      text-align: center;
    }

    .hidden {
      display: none;
    }

    table th, table td {
      vertical-align: middle;
      text-align: center;
    }

    th {
      background-color: #343a40 !important;
      color: white !important;
    }

    select.asistenciaSelect {
      min-width: 100px;
    }
  </style>
</head>
<body>

  <div class="container py-5">
    <h1 class="text-center mb-4 fw-bold">Registrar Asistencia</h1>

    <div class="mb-4">
      <label for="sesionSelect" class="form-label">Selecciona una sesión:</label>
      <select id="sesionSelect" class="form-select shadow-sm">
        <option value="">-- Seleccione una sesión --</option>
      </select>
    </div>

    <div class="table-container mb-4">
      <div class="table-responsive">
        <table class="table table-hover align-middle" id="tablaEstudiantes">
          <thead>
            <tr>
              <th>Tipo de Identificación</th>
              <th>Número de Identificación</th>
              <th>Nombres Completos</th>
              <th>¿Asistió?</th>
            </tr>
          </thead>
          <tbody>
            <!-- Filas generadas por JS -->
          </tbody>
        </table>
      </div>
    </div>

    <div class="d-grid">
      <button id="btnRegistrar" class="btn btn-primary btn-lg shadow-sm">Registrar Asistencia</button>
    </div>
  </div>

  <!-- Modal de información -->
  <div id="modalInformacion" class="modal hidden">
    <div class="modal-contenido">
      <h2>Información</h2>
      <ul id="listaMensajes" class="text-start"></ul>
      <button onclick="cerrarModal()" class="btn btn-secondary mt-3">Cerrar</button>
    </div>
  </div>

  <script src="registrarAsistencia.js"></script>
</body>
</html>
