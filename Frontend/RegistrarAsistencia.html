<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrar Asistencia</title>
    <link rel="stylesheet" href="registrarAsistencia.css">
    <style>
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal.hidden {
            display: none;
        }

        .modal-contenido {
            background-color: white;
            padding: 2rem;
            border-radius: 10px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <h1>Registrar Asistencia</h1>

        <label for="sesionSelect">Selecciona una sesión:</label>
        <select id="sesionSelect">
            <option value="">-- Seleccione una sesión --</option>
        </select>

        <table id="tablaEstudiantes">
            <thead>
                <tr>
                    <th>Tipo de Identificación</th>
                    <th>Número de Identificación</th>
                    <th>Nombres Completos</th>
                    <th>¿Asistió?</th>
                </tr>
            </thead>
            <tbody>
                <!-- Se llenará con JS -->
            </tbody>
        </table>

        <button id="btnRegistrar">Registrar Asistencia</button>
    </div>

    <!-- Modal para mostrar errores -->
    <div id="modalErrores" class="modal hidden">
        <div class="modal-contenido">
            <h2>Errores al registrar asistencia</h2>
            <ul id="listaErrores"></ul>
            <button onclick="cerrarModal()">Cerrar</button>
        </div>
    </div>

    <script src="registrarAsistencia.js"></script>
</body>
</html>
