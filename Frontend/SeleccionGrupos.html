<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grupos del Profesor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
  <style>
    body {
      background-color: #f8f9fa;
      padding-top: 2rem;
    }
    .card {
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      border-radius: 1rem;
    }
    .card-title {
      font-weight: bold;
    }
    .btn-seleccionar {
      width: 100%;
    }
  </style>
</head>
<body>
  <div id="app" class="container">
    <h1 class="text-center mb-5">Mis Grupos</h1>
    <div v-if="grupos.length" class="row g-4">
      <div class="col-md-6 col-lg-4" v-for="grupo in grupos" :key="grupo.id">
        <div class="card h-100">
          <div class="card-body">
            <h5 class="card-title">{{ grupo.nombreMateria }}</h5>
            <p class="card-text"><strong>ID:</strong> {{ grupo.id }}</p>
            <p class="card-text"><strong>Estudiantes:</strong> {{ grupo.cantidadEstudiantes }}</p>
            <button class="btn btn-primary btn-seleccionar" @click="seleccionarGrupo(grupo.id)">Seleccionar Grupo</button>
          </div>
        </div>
      </div>
    </div>
    <div v-else class="text-center">
      <div class="spinner-border" role="status"></div>
      <p class="mt-3">Cargando grupos...</p>
    </div>
  </div>

  <script>
    const { createApp } = Vue;

    createApp({
      data() {
        return {
          grupos: []
        };
      },
      mounted() {
        const email = sessionStorage.getItem("correoProfesor");
        if (!email) {
          alert("No se encontró el correo del profesor. Por favor, vuelva a iniciar sesión.");
          window.location.href = "index.html";
          return;
        }

        fetch("http://localhost:8080/asisteuco/apigateway/obtenerGrupos", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ email })
        })
        .then(async res => {
          if (!res.ok) throw new Error("Respuesta no válida del backend");

          const data = await res.json();

          if (!data.grupos || !data.idProfesor) {
            throw new Error("Estructura inesperada en la respuesta del servidor");
          }

          this.grupos = data.grupos;
          sessionStorage.setItem("profesorId", data.idProfesor); // ✅ SE GUARDA AQUÍ
        })
        .catch(err => {
          console.error("Error al obtener los grupos:", err);
          alert("Hubo un error cargando los grupos.");
        });
      },
      methods: {
        seleccionarGrupo(id) {
          sessionStorage.setItem("grupoSeleccionado", id);
          window.location.href = "RegistrarAsistencia.html";
        }
      }
    }).mount('#app');
  </script>
</body>
</html>
